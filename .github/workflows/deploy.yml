name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - production  # Runs whenever code is pushed to the 'production' branch

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Run the deploy script we created on the VM
            /home/administrator/mommers-co/deploy.sh
